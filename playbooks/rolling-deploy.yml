---
- name: Ansible rolling deployment
  hosts: webservers
  become: true
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Display deployment target
      ansible.builtin.debug:
        msg: "Deploying application on {{ inventory_hostname }}"

    - name: Deploy application webpage
      ansible.builtin.copy:
        content: |
          <html>
          <head><title>My Updated CI/CD Project</title></head>
          <body>
          <h1>Welcome to My Project!</h1>
          <p>Deployment Version: 2.0</p>
          <p>Server: {{ inventory_hostname }}</p>
          <p>Updated automatically using GitHub, Jenkins and Ansible.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Restart Nginx

    - name: Verify Nginx HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
